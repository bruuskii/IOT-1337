apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: apps-ingress

spec:
  defaultBackend:
    service:
      name: app3-service
      port:
        number: 80

  rules:

    - host: app1.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nginx-service
                port:
                  number: 80

    - host: app2.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: apache-service
                port:
                  number: 80